<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Secure EHR Insight Clinical Validator banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#241148"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- shield + medical cross -->
  <g transform="translate(90 70)">
    <path d="M90 0 L170 30 V110 C170 165 135 200 90 220 C45 200 10 165 10 110 V30 Z"
          fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="4"/>
    <rect x="78" y="62" width="24" height="84" rx="6" fill="url(#accent)"/>
    <rect x="48" y="92" width="84" height="24" rx="6" fill="url(#accent)"/>
  </g>

  <!-- network nodes on the right -->
  <g stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M930 70 L1010 130 L1090 90"/>
    <path d="M1010 130 L980 220 L1080 240"/>
    <path d="M930 70 L980 220"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="930" cy="70" r="8"/>
    <circle cx="1010" cy="130" r="10"/>
    <circle cx="1090" cy="90" r="7"/>
    <circle cx="980" cy="220" r="9"/>
    <circle cx="1080" cy="240" r="7"/>
  </g>

  <!-- text -->
  <text x="320" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Secure EHR Insight</text>
  <text x="320" y="185" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="url(#accent)">Clinical Validator</text>
  <text x="320" y="235" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#ddd6fe">Guardrailed RAG for patient-scoped clinical Q&amp;A</text>
  <text x="320" y="268" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#a78bfa">FastAPI  •  Streamlit  •  pgvector  •  NeMo Guardrails  •  Groq</text>
</svg>
